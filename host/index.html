<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>主机 · 冷色系放映室</title><link rel="stylesheet" href="/cinema/style.css"><script defer src="/cinema/config.js"></script><script defer src="/cinema/protocol.js"></script><script defer src="/cinema/app.js"></script></head>
<body data-host="true"><main><h1>冷色系放映室</h1><p class="subtitle" id="title">主机入口</p><form id="login" class="host-controls"><input id="password" type="password" autocomplete="current-password" required maxlength="256" aria-label="主机口令" placeholder="主机口令"><button id="claim" type="submit">接管放映</button></form><div id="host-controls" class="host-controls" hidden><label class="choose">选择影片<input id="file" type="file" accept="video/*,.mp4,.webm,.mov,.m4v"></label><input id="name" aria-label="电影名称" maxlength="160" placeholder="电影名称"><button id="host-play" disabled>开始放映</button><button id="stop" class="quiet">结束</button></div><div class="screen" id="screen"><span class="fullscreen-title" id="fullscreen-title"></span><video id="video" controls playsinline preload="metadata" controlslist="nodownload noplaybackrate"></video><div class="overlay" id="overlay" role="status" aria-live="polite"><p id="message">输入口令后接管放映</p><button id="action" hidden>点击播放</button></div><button class="fullscreen" id="fullscreen" title="全屏" aria-label="全屏">⛶</button></div></main></body></html>
