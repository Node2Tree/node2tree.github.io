<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>冷色系放映室</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0d0d12;
    color: #eee;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main {
    width: min(960px, 94vw);
    text-align: center;
  }
  h1 { font-weight: 400; letter-spacing: 5px; }
  .sub { color: #aaa; margin-bottom: 30px; }
  .screen { position: relative; background: #000; }
  video { display: block; width: 100%; }
  button {
    background: #e5e0d5;
    color: #111;
    border: 0;
    border-radius: 5px;
    padding: 12px 28px;
    cursor: pointer;
    margin: 18px 0;
  }
  #status { color: #aaa; }
  main { padding: 28px 0; }
  .info { text-align:left; background:#151b26; border:1px solid #293447; border-radius:12px; padding:12px 22px; margin:20px 0; line-height:1.8; color:#c6d2e3; }
  .source { font-size:12px; color:#91a0b8; } a { color:#a9c9f2; }
  .timeline { font-variant-numeric:tabular-nums; color:#b5c6de; }
  progress { width:100%; height:10px; accent-color:#91b8ec; }
</style>
</head>
<body>
<main>
  <h1>冷色系放映室</h1>
  <h2 id="title">Buddy (2026)</h2>
  <section class="info" aria-label="电影信息">
    <p>2026 · 美国 · 英语 · 恐怖 / 喜剧</p>
    <p>导演：Casper Kelly<br>主演：Cristin Milioti、Delaney Quinn、Topher Grace<br>Buddy 配音：Keegan-Michael Key</p>
    <p>一群孩子被困在看似欢乐的儿童电视节目中，必须设法逃离主持人 Buddy 的邪恶掌控。</p>
    <p class="source">资料：<a href="https://tv.apple.com/us/movie/buddy/umc.cmc.73vxart76v0s9i3ghtmf6m3f4" target="_blank" rel="noopener">Apple TV</a> · <a href="https://www.rottentomatoes.com/m/buddy_2026" target="_blank" rel="noopener">Rotten Tomatoes</a>。片长以当前视频实际时长为准。</p>
  </section>
  <div class="screen">
    <video id="video" playsinline
           preload="metadata"
           disablepictureinpicture
           controlslist="nodownload noplaybackrate">
    </video>
  </div>
  <section class="timeline" aria-label="实时放映进度">
    <p id="schedule-progress"></p>
    <progress id="movie-progress" max="1" value="0" aria-label="当前播放进度"></progress>
    <p id="playback-progress">等待加载影片时长</p>
  </section>
  <button id="enter">进入放映室</button>
  <p id="status" role="status" aria-live="polite">等待放映</p>
  <p class="sub">2026 年 11 月 2 日 19:20 · 北京时间</p>
  <p><a href="/archive/2026-10-12/" style="color:#aaa">旧站存档</a></p>
</main>

<script>
// ===== 管理员只需要修改以下三项 =====

const MOVIE_URL =
  "https://pub-634772894be64240aae0a2b67145fbbc.r2.dev/movie.mp4";

const MOVIE_TITLE = "Buddy (2026)";

const START_TIME = "2026-11-02T19:20:00+08:00";

// =================================

const video = document.getElementById("video");
const button = document.getElementById("enter");
const status = document.getElementById("status");

document.getElementById("title").textContent =
  MOVIE_TITLE;

const startMs = Date.parse(START_TIME);
let clockOffset = 0;
let entered = false;
let syncing = false;
let playPending = false;
let needsGesture = false;

function offerRetry(message) {
  needsGesture = true;
  button.hidden = false;
  button.textContent = "点击继续播放";
  status.textContent = message;
}

function tryPlay() {
  if (playPending || needsGesture || now() < startMs) return;
  playPending = true;
  video.play().then(() => {
    button.hidden = true;
    status.textContent = "正在放映 · 按开场时间同步";
  }).catch(() => {
    offerRetry("浏览器暂停了播放，请点击继续播放");
  }).finally(() => { playPending = false; });
}

function now() {
  return Date.now() + clockOffset;
}

// 通过网页服务器响应时间修正本机时钟
async function syncClock() {
  try {
    const before = Date.now();
    const response = await fetch(
      location.pathname + "?clock=" + Date.now(),
      { method: "HEAD", cache: "no-store" }
    );
    const after = Date.now();
    const date = response.headers.get("Date");
    if (response.ok && date && Number.isFinite(Date.parse(date))) {
      clockOffset =
        Date.parse(date) - (before + after) / 2;
    }
  } catch (e) {
    console.warn("校时失败，暂用本机时间", e);
  }
}

function targetTime() {
  return Math.max(0, (now() - startMs) / 1000);
}

function fixProgress() {
  if (!entered || syncing || !Number.isFinite(video.duration) || video.duration <= 0 || video.error) return;
  if (now() < startMs) {
    video.pause();
    status.textContent = "影片尚未开场";
    return;
  }

  const elapsed = targetTime();

  if (elapsed >= video.duration) {
    video.pause();
    status.textContent = "本场放映已结束";
    return;
  }

  if (!video.seeking && Math.abs(video.currentTime - elapsed) > 3) {
    syncing = true;
    video.currentTime = elapsed;
    // Wait until the media seek actually finishes before correcting again.
  }

  if (video.paused && elapsed < video.duration) {
    tryPlay();
  }
}

async function start() {
  entered = true;
  needsGesture = false;
  button.hidden = true;

  if (now() < startMs) {
    status.textContent = "影片尚未开场";
    return;
  }

  status.textContent = "正在连接放映...";
  if (!video.src || video.error) {
    video.src = MOVIE_URL;
  }

  if (video.readyState < 1) {
    video.load();
    tryPlay();
  } else {
    fixProgress();
  }
}

button.addEventListener("click", start);

video.addEventListener("loadedmetadata", async () => {
  if (entered && now() >= startMs) {
    const elapsed = targetTime();
    if (elapsed >= video.duration) {
      status.textContent = "本场放映已结束";
      return;
    }
    video.currentTime = elapsed;
    tryPlay();
  }
});

video.addEventListener("seeked", () => { syncing = false; });

video.addEventListener("seeking", () => {
  if (!syncing) fixProgress();
});

video.addEventListener("pause", () => {
  if (!syncing && entered && now() >= startMs && targetTime() < video.duration && !video.error) {
    tryPlay();
  }
});

video.addEventListener("error", () => {
  playPending = false;
  offerRetry("视频加载失败，请检查网络后重试");
});

// 每 3 秒校准进度
setInterval(() => {
  if (!entered) return;
  if (now() < startMs) {
    status.textContent = "影片尚未开场";
    return;
  }
  if (!video.src) {
    start();
  } else {
    fixProgress();
  }
}, 3000);

// 定期向服务器校时
syncClock();
setInterval(syncClock, 60000);

// 返回页面后立即恢复当前时间轴
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) fixProgress();
});

function formatTime(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60]
    .map(n => String(n).padStart(2, "0")).join(":");
}
function renderProgress() {
  const remaining = (startMs - now()) / 1000;
  const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : null;
  const elapsed = targetTime();
  document.getElementById("schedule-progress").textContent = remaining > 0
    ? "距离开场 " + formatTime(Math.ceil(remaining))
    : duration && elapsed >= duration ? "本场放映已结束"
    : "实时放映进度 " + formatTime(duration ? Math.min(elapsed, duration) : elapsed);
  const current = Math.max(0, video.currentTime || 0);
  const progress = document.getElementById("movie-progress");
  progress.max = duration || 1;
  progress.value = duration ? Math.min(current, duration) : 0;
  document.getElementById("playback-progress").textContent = duration
    ? "当前播放 " + formatTime(current) + " / " + formatTime(duration) +
      " · 剩余 " + formatTime(Math.max(0, duration - current)) +
      (video.error ? " · 加载失败" : video.seeking ? " · 正在同步" : video.paused ? " · 未播放" : video.readyState < 3 ? " · 缓冲中" : " · 播放中")
    : "当前播放 " + formatTime(current) + " / 时长加载中";
}
video.src = MOVIE_URL;
video.addEventListener("timeupdate", renderProgress);
video.addEventListener("loadedmetadata", renderProgress);
setInterval(renderProgress, 1000);
renderProgress();

</script>
</body>
</html>
